name: Web game Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'updates/latest.json'
      - 'updates/files/**'
      - 'tooling/pages/**'
      - '.github/workflows/web-game-pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Reconstruct and verify the current game only
        run: node tooling/pages/rebuild-pages-site.mjs --updates updates --out _site
      - name: Upload only the latest game artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
